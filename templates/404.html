{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada – Carla Variedades</title>
    <script src="{% static 'core/js/tailwind.js' %}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full text-center">
        <div class="bg-white rounded-[2rem] shadow-sm border border-gray-50 p-10">
            <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <p class="text-5xl font-extrabold text-gray-200 mb-2">404</p>
            <h1 class="text-xl font-bold text-gray-900 mb-2">Página não encontrada</h1>
            <p class="text-sm text-gray-400 mb-8">O endereço que você tentou acessar não existe ou foi removido.</p>
            <a href="/"
               class="inline-block bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-6 py-3 rounded-2xl transition-colors">
                Voltar ao início
            </a>
        </div>
    </div>
</body>
</html>
