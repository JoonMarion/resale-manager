{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro interno – Carla Variedades</title>
    <script src="{% static 'core/js/tailwind.js' %}"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background-color: #f9fafb;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="max-w-sm w-full text-center">
        <div class="bg-white rounded-[2rem] shadow-sm border border-gray-50 p-10">
            <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                </svg>
            </div>
            <p class="text-5xl font-extrabold text-gray-200 mb-2">500</p>
            <h1 class="text-xl font-bold text-gray-900 mb-2">Erro interno do servidor</h1>
            <p class="text-sm text-gray-400 mb-8">Algo deu errado do nosso lado. Já fomos notificados e estamos trabalhando na correção.</p>
            <a href="/"
               class="inline-block bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-6 py-3 rounded-2xl transition-colors">
                Voltar ao início
            </a>
        </div>
    </div>
</body>
</html>
