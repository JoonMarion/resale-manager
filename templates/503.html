<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em manutenção – Carla Variedades</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #f9fafb;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 2rem;
            border: 1px solid #f9fafb;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            padding: 2.5rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .icon-wrap {
            width: 4rem; height: 4rem;
            background: #fefce8;
            border-radius: 1rem;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon-wrap svg { width: 2rem; height: 2rem; color: #ca8a04; stroke: #ca8a04; }
        .code { font-size: 3rem; font-weight: 800; color: #e5e7eb; margin-bottom: .5rem; }
        h1 { font-size: 1.125rem; font-weight: 700; color: #111827; margin-bottom: .5rem; }
        p { font-size: .875rem; color: #9ca3af; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
        </div>
        <p class="code">503</p>
        <h1>Em manutenção</h1>
        <p>O sistema está temporariamente fora do ar para manutenção. Voltamos em breve!</p>
    </div>
</body>
</html>
