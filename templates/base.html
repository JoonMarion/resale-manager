{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Revenda{% endblock %}</title>
    <script src="{% static 'core/js/tailwind.js' %}"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: block; }
        .htmx-request.htmx-indicator { display: block; }
    </style>
</head>
<body class="bg-gray-50 pb-24">

    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-900">{% block header_title %}Revenda{% endblock %}</h1>

        <!-- Settings dropdown -->
        <div class="relative" id="settings-menu">
            <button onclick="toggleSettingsMenu()"
                class="text-gray-400 hover:text-gray-600 transition-colors focus:outline-none"
                aria-label="Configurações">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <!-- Dropdown panel -->
            <div id="settings-dropdown"
                 class="hidden absolute right-0 mt-2 w-44 bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden z-50">
                <a href="{% url 'users:profile' %}"
                   class="flex items-center space-x-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Perfil</span>
                </a>
                <div class="border-t border-gray-50"></div>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit"
                        class="w-full flex items-center space-x-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span>Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </header>

    <script>
        function toggleSettingsMenu() {
            document.getElementById('settings-dropdown').classList.toggle('hidden');
        }
        document.addEventListener('click', function(e) {
            var menu = document.getElementById('settings-menu');
            if (menu && !menu.contains(e.target)) {
                document.getElementById('settings-dropdown').classList.add('hidden');
            }
        });
    </script>

    <!-- Main Content -->
    <main class="p-4 max-w-lg mx-auto">
        {% block content %}{% endblock %}
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around items-center py-3 px-2 z-20">
        <a href="{% url 'dashboard:index' %}" class="flex flex-col items-center space-y-1 {% if request.resolver_match.app_name == 'dashboard' %}text-green-600{% else %}text-gray-400{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            <span class="text-[10px] font-medium">Início</span>
        </a>
        <a href="{% url 'sales:list' %}" class="flex flex-col items-center space-y-1 {% if request.resolver_match.app_name == 'sales' %}text-green-600{% else %}text-gray-400{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span class="text-[10px] font-medium">Vendas</span>
        </a>
        <a href="{% url 'customers:list' %}" class="flex flex-col items-center space-y-1 {% if request.resolver_match.app_name == 'customers' %}text-green-600{% else %}text-gray-400{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <span class="text-[10px] font-medium">Clientes</span>
        </a>
        <a href="{% url 'products:list' %}" class="flex flex-col items-center space-y-1 {% if request.resolver_match.app_name == 'products' %}text-green-600{% else %}text-gray-400{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            <span class="text-[10px] font-medium">Produtos</span>
        </a>
        <a href="{% url 'stock:list' %}" class="flex flex-col items-center space-y-1 {% if request.resolver_match.app_name == 'stock' %}text-green-600{% else %}text-gray-400{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="text-[10px] font-medium">Estoque</span>
        </a>
    </nav>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end justify-center" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div id="modal-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-50 transition-opacity opacity-0" aria-hidden="true" onclick="closeModal()"></div>
        
        <div id="modal-content" class="relative bg-white rounded-t-[2.5rem] w-full max-w-lg shadow-2xl transform translate-y-full transition-transform duration-300 ease-out z-10 overflow-hidden">
            <!-- Content injected here -->
        </div>
    </div>

    <script>
        function openModal() {
            const container = document.getElementById('modal-container');
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');

            container.classList.remove('hidden');
            // Force reflow to ensure the transition happens
            void content.offsetWidth;
            
            backdrop.classList.remove('opacity-0');
            backdrop.classList.add('opacity-100');
            content.classList.remove('translate-y-full');
            content.classList.add('translate-y-0');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');

            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            content.classList.remove('translate-y-0');
            content.classList.add('translate-y-full');

            setTimeout(() => {
                document.getElementById('modal-container').classList.add('hidden');
            }, 300);
        }

        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.target.id === 'modal-content') {
                openModal();
            }
        });

        /* ── CSRF token para todas as requisições HTMX ────────────── */
        document.body.addEventListener('htmx:configRequest', function(evt) {
            var cookie = document.cookie.split(';').find(function(c) { return c.trim().startsWith('csrftoken='); });
            if (cookie) evt.detail.headers['X-CSRFToken'] = cookie.split('=')[1].trim();
        });

        /* ── Custom Toast ─────────────────────────────────────────── */
        function showToast(message, type) {
            type = type || 'info';
            var palette = {
                success: 'bg-green-50 border-green-100 text-green-800',
                error:   'bg-red-50 border-red-100 text-red-800',
                warning: 'bg-yellow-50 border-yellow-100 text-yellow-800',
                info:    'bg-blue-50 border-blue-100 text-blue-800'
            };
            var icons = {
                success: '<path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>',
                error:   '<path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>',
                warning: '<path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM10 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-4a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5Z"/>',
                info:    '<path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>'
            };
            var toast = document.createElement('div');
            toast.className = 'fixed top-20 left-1/2 z-[200] flex items-center px-5 py-4 rounded-2xl border shadow-lg text-sm font-medium max-w-sm w-[calc(100%-2rem)] transition-all duration-300 -translate-x-1/2 -translate-y-4 opacity-0 ' + (palette[type] || palette.info);
            toast.innerHTML = '<svg class="flex-shrink-0 w-5 h-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">' + (icons[type] || icons.info) + '</svg><span>' + message + '</span>';
            document.body.appendChild(toast);
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    toast.classList.remove('-translate-y-4', 'opacity-0');
                });
            });
            setTimeout(function() {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(function() { toast.remove(); }, 300);
            }, 3500);
        }

        /* ── Custom Confirm Dialog ────────────────────────────────── */
        function showConfirm(message, onConfirm, title) {
            title = title || 'Confirmar ação';
            var overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[300] flex items-end justify-center';
            overlay.innerHTML =
                '<div class="fixed inset-0 bg-gray-900 bg-opacity-50 transition-opacity" id="confirm-backdrop"></div>' +
                '<div class="relative bg-white rounded-t-[2.5rem] w-full max-w-lg shadow-2xl px-6 pt-6 pb-8 transform translate-y-full transition-transform duration-300 ease-out z-10" id="confirm-card">' +
                    '<div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-5"></div>' +
                    '<h3 class="text-lg font-bold text-gray-900 mb-2">' + title + '</h3>' +
                    '<p class="text-gray-500 text-sm mb-6">' + message + '</p>' +
                    '<div class="space-y-3">' +
                        '<button id="confirm-ok" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl transition-all active:scale-[0.98]">Confirmar</button>' +
                        '<button id="confirm-cancel" class="w-full py-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition-all active:scale-[0.98]">Cancelar</button>' +
                    '</div>' +
                '</div>';
            document.body.appendChild(overlay);
            var card = overlay.querySelector('#confirm-card');
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    card.classList.remove('translate-y-full');
                    card.classList.add('translate-y-0');
                });
            });
            function close() {
                card.classList.remove('translate-y-0');
                card.classList.add('translate-y-full');
                setTimeout(function() { overlay.remove(); }, 300);
            }
            overlay.querySelector('#confirm-ok').addEventListener('click', function() { close(); onConfirm(); });
            overlay.querySelector('#confirm-cancel').addEventListener('click', close);
            overlay.querySelector('#confirm-backdrop').addEventListener('click', close);
        }

        /* ── HTMX server-triggered toasts ────────────────────────── */
        document.body.addEventListener('showError', function(evt) {
            showToast(evt.detail.value, 'error');
        });
        document.body.addEventListener('showSuccess', function(evt) {
            showToast(evt.detail.value, 'success');
        });        document.body.addEventListener('itemCreated', function() {
            closeModal();
        });    </script>

    {% block extra_js %}{% endblock %}

    {% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% for message in messages %}
                showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}");
            {% endfor %}
        });
    </script>
    {% endif %}

</body>
</html>
