<div class="bg-white dark:bg-slate-900 rounded-[2.5rem] lg:rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm lg:shadow-none overflow-hidden sticky top-24 transition-colors">
    <div class="p-6 border-b border-slate-50 dark:border-slate-800 flex justify-between items-center lg:block">
        <h2 class="text-lg font-black text-slate-900 dark:text-slate-100 flex items-center gap-2">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            Categorias
        </h2>
        <!-- Close button only for mobile drawer -->
        <button onclick="closeDrawer()" class="lg:hidden p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 dark:text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    
    <div class="p-4 max-h-[calc(100vh-180px)] overflow-y-auto no-scrollbar pb-12 lg:pb-6">
        <a href="?q={{ search_query }}&sort={{ current_sort }}" class="flex items-center gap-2 px-4 py-3 mb-3 rounded-2xl text-sm font-bold transition-all {% if not current_category_obj %}bg-slate-900 dark:bg-green-600 text-white shadow-xl shadow-slate-200 dark:shadow-none{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 border border-transparent hover:border-slate-100 dark:hover:border-slate-700{% endif %}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            Todas as Categorias
        </a>

        <div class="space-y-1">
            {% include 'catalog/_category_tree_public.html' with nodes=all_categories level=0 %}
        </div>
        
        {% if request.user.is_authenticated %}
            <div class="mt-8 pt-6 border-t border-slate-50 dark:border-slate-800 px-2">
                <a href="{% url 'catalog:category_list' %}" class="w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl text-slate-400 dark:text-slate-500 hover:text-green-600 dark:hover:text-green-400 hover:border-green-200 dark:hover:border-green-800 transition-all group">
                    <svg class="w-5 h-5 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="text-xs font-bold uppercase tracking-widest">Painel Administrativo</span>
                </a>
            </div>
        {% endif %}
    </div>
</div>
