{% extends 'base.html' %}
{% block title %}Categorias - Catálogo{% endblock %}
{% block header_title %}Categorias{% endblock %}

{% block content %}
    <!-- Quick Actions -->
    <div class="mb-6 flex justify-end">
        <a href="{% url 'catalog:public_list' %}" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-100 rounded-2xl text-xs font-black uppercase tracking-widest text-green-600 shadow-sm hover:shadow-md transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            Ver Catálogo Público
        </a>
    </div>

    <!-- Search and Sort Bar -->
    <div class="mb-6 flex gap-2">
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" name="q" value="{{ q|default:'' }}"
                class="w-full pl-10 pr-4 py-3 bg-white border border-gray-100 rounded-2xl shadow-sm focus:ring-2 focus:ring-green-500 outline-none transition-all" 
                placeholder="Buscar categoria..."
                hx-get="{% url 'catalog:category_list' %}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#category-list"
                hx-indicator=".htmx-indicator"
                hx-include="[name='sort']">
        </div>
        <div class="relative">
            <select name="sort" 
                class="bg-white border border-gray-100 rounded-2xl shadow-sm pl-3 pr-8 py-3 focus:ring-2 focus:ring-green-500 outline-none transition-all appearance-none cursor-pointer"
                hx-get="{% url 'catalog:category_list' %}"
                hx-target="#category-list"
                hx-include="[name='q']">
                <option value="alpha_asc" {% if current_sort == 'alpha_asc' %}selected{% endif %}>A-Z</option>
                <option value="alpha_desc" {% if current_sort == 'alpha_desc' %}selected{% endif %}>Z-A</option>
                <option value="recent" {% if current_sort == 'recent' %}selected{% endif %}>Recentes</option>
                <option value="oldest" {% if current_sort == 'oldest' %}selected{% endif %}>Antigas</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
        </div>
    </div>

    <!-- Category List -->
    <div id="category-list"
        hx-get="{% url 'catalog:category_list' %}"
        hx-trigger="reloadCategories from:body"
        hx-swap="innerHTML">
        {% include 'catalog/category_list_partial.html' %}
    </div>

<!-- FAB -->
<button hx-get="{% url 'catalog:category_create' %}" hx-target="#modal-content"
    class="fixed bottom-24 right-6 bg-green-600 hover:bg-green-700 text-white flex items-center space-x-2 px-6 py-4 rounded-3xl shadow-xl shadow-green-100 transition-all active:scale-95 z-30">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    <span class="font-bold">Nova categoria</span>
</button>
{% endblock %}
