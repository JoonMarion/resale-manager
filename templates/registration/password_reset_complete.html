{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso - Carla Variedades</title>
    <script src="{% static 'core/js/tailwind.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-10 rounded-[2.5rem] shadow-sm w-full max-w-sm border border-gray-100 text-center">
        <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-4">Senha Redefinida!</h2>
        <p class="text-gray-500 text-sm mb-8 leading-relaxed">Sua senha foi alterada com sucesso. Agora você já pode acessar sua conta.</p>
        <a href="{% url 'users:login' %}" class="block w-full py-4 bg-green-600 text-white font-bold rounded-2xl transition-all active:scale-[0.98]">Fazer Login</a>
    </div>
</body>
</html>
