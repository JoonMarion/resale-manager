{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail enviado - Carla Variedades</title>
    <script src="{% static 'core/js/tailwind.js' %}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="bg-white px-8 py-6 rounded-[2.5rem] shadow-sm w-full max-w-sm border border-gray-100 text-center">
        <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h2 class="text-lg font-bold text-gray-900 mb-4">Verifique seu e-mail</h2>
        <p class="text-gray-500 text-sm mb-5 leading-relaxed">Enviamos as instruções para redefinição de senha para o seu endereço de e-mail.</p>
        <a href="{% url 'users:login' %}" class="block w-full py-3 bg-gray-900 text-white font-bold rounded-2xl transition-all active:scale-[0.98]">Voltar para o login</a>
    </div>
</body>
</html>
